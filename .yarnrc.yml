nodeLinker: node-modules
enableGlobalCache: false
enableMirror: false
cacheFolder: '${HOME}/.yarn/berry/cache'
globalFolder: '${HOME}/.yarn/berry/farmslot'
nmMode: hardlinks-global
plugins:
  - path: scripts/yarn-hardlink-store.cjs

packageExtensions:
  '@siteed/audio-studio@*':
    dependencies:
      '@expo/config-plugins': '~56.0.8'

# NPM publication uses an environment token; never commit token values.
npmScopes:
  farmslot:
    npmRegistryServer: 'https://registry.npmjs.org'
    npmPublishRegistry: 'https://registry.npmjs.org'
    npmAlwaysAuth: true
    npmAuthToken: '${NPM_FARMSLOT_TOKEN:-}'
