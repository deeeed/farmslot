name: Cached workspace setup
description: Restore installed dependencies and validate the immutable Yarn install
inputs:
  lint-cache:
    description: This job owns the repository lint cache
    default: 'false'
  reuse-validated-install:
    description: Reuse a restored install as is; the install job validates the same tree with yarn install --immutable
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22.23.4'
    - shell: bash
      run: corepack enable
    - id: cache-keys
      uses: ./.github/actions/ci-cache-keys
    - uses: actions/cache/restore@v4
      id: dependencies
      with:
        path: ${{ steps.cache-keys.outputs.install-paths }}
        key: ${{ steps.cache-keys.outputs.install-key }}
    - shell: bash
      env:
        REUSE_VALIDATED_INSTALL: ${{ inputs.reuse-validated-install }}
        INSTALL_CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
      run: |
        if [[ "$REUSE_VALIDATED_INSTALL" == true && "$INSTALL_CACHE_HIT" == true ]] &&
           [[ -s .yarn/install-state.gz && -s node_modules/.yarn-state.yml ]]; then
          echo "Reusing the restored Yarn install; the install job validates it"
        else
          yarn install --immutable
        fi
    # Publish prerequisites before long full-suite jobs, so other PRs can restore
    # the default-branch cache as soon as setup passes.
    - if: steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.cache-keys.outputs.install-paths }}
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
    # The PR planner needs only TypeScript; publish this install's copy so the
    # planner can start without restoring and validating the whole install.
    - id: planner-typescript
      uses: actions/cache/restore@v4
      with:
        path: node_modules/typescript
        key: ${{ steps.cache-keys.outputs.planner-key }}
        lookup-only: true
    - if: steps.planner-typescript.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: node_modules/typescript
        key: ${{ steps.planner-typescript.outputs.cache-primary-key }}
    - uses: actions/cache@v4
      with:
        path: |
          .cache/node-compile
        key: compiler-v1-${{ runner.os }}-${{ runner.arch }}-node22.23.4-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
        restore-keys: compiler-v1-${{ runner.os }}-${{ runner.arch }}-node22.23.4-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-
    - if: inputs.lint-cache == 'true'
      uses: actions/cache@v4
      with:
        path: .cache/eslint
        key: eslint-v1-${{ runner.os }}-node22.23.4-${{ hashFiles('yarn.lock', 'eslint.config.mjs', '.tool-versions') }}-${{ github.sha }}
        restore-keys: eslint-v1-${{ runner.os }}-node22.23.4-${{ hashFiles('yarn.lock', 'eslint.config.mjs', '.tool-versions') }}-
    - shell: bash
      run: echo "NODE_COMPILE_CACHE=$GITHUB_WORKSPACE/.cache/node-compile" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@v4
      id: builds
      with:
        path: |
          packages/*/dist
          .cache/ci-builds/receipt.json
        key: builds-v2-${{ runner.os }}-${{ runner.arch }}-node22.23.4-${{ hashFiles('package.json', 'yarn.lock', '.yarnrc.yml', 'packages/*/src/**', 'packages/*/tsconfig*.json', 'packages/*/package.json', 'apps/command-center/tsconfig*.json', 'tsconfig*.json', 'scripts/lib/**', 'scripts/quality/ci-build*.mjs') }}
    - if: steps.builds.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/quality/ci-build-prerequisites.mjs
    - if: steps.builds.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          packages/*/dist
          .cache/ci-builds/receipt.json
        key: ${{ steps.builds.outputs.cache-primary-key }}
    - shell: bash
      run: node --input-type=module -e "import { verifyBuildReceipt } from './scripts/quality/ci-build-state.mjs'; verifyBuildReceipt(process.cwd());"
