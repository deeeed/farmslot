name: LOC History

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: loc-history
  cancel-in-progress: false

jobs:
  record:
    name: Record framework LOC snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Do NOT persist the checkout token as an http.extraheader: peter-evans/
          # create-pull-request adds its own Authorization, and two Authorization
          # headers make GitHub reject git ops with "Duplicate header" / HTTP 400.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Record current LOC snapshot
        run: yarn quality:loc:record

      - name: Validate LOC history JSON
        run: python3 -m json.tool docs/reference/loc-history.json >/dev/null

      # Post-record sanity check: catches record/serialization regressions before opening a PR.
      - name: Verify recorded LOC history
        run: yarn quality:loc:verify

      - name: Detect LOC history drift
        id: loc-drift
        run: |
          if git diff --quiet -- docs/reference/loc-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "LOC history unchanged after record; skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "LOC history changed after record; will open PR."
          fi

      - name: Create LOC history PR
        if: steps.loc-drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: chore/loc-history
          commit-message: 'chore(quality): update LOC history'
          title: 'chore(quality): update LOC history'
          body: |
            Automated LOC history snapshot update.

            Keeps `docs/reference/loc-history.json` current without blocking feature PRs on snapshot drift.