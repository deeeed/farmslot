name: LOC History

# Manual-only. The framework LOC snapshot is fully replayable on demand, so it
# does not need to run on every push to main (where it only ever produced a
# red post-merge check and noisy auto-PRs). Run it by hand from the Actions tab
# when you want to refresh docs/reference/loc-history.json, then commit the diff
# through a normal PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-history
  cancel-in-progress: false

jobs:
  record:
    name: Record framework LOC snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Record current LOC snapshot
        run: yarn quality:loc:record

      - name: Validate LOC history JSON
        run: python3 -m json.tool docs/reference/loc-history.json >/dev/null

      # Post-record sanity check: catches record/serialization regressions.
      - name: Verify recorded LOC history
        run: yarn quality:loc:verify

      # Surface the refreshed snapshot for the operator to commit through a normal
      # PR. No auto-commit/auto-PR: keeps history clean and needs no elevated perms.
      - name: Show LOC history diff
        run: |
          if git diff --quiet -- docs/reference/loc-history.json; then
            echo "LOC history unchanged."
          else
            echo "LOC history changed — copy the diff below into a normal PR:"
            git --no-pager diff -- docs/reference/loc-history.json
          fi
