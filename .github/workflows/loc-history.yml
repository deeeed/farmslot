name: LOC History

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify framework LOC snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Verify committed LOC history matches current tree
        run: |
          set -euo pipefail
          BEFORE_SHA="$(git rev-parse HEAD)"
          cp docs/reference/loc-history.json /tmp/loc-history.committed.json
          node scripts/quality/count-loc.mjs --scope framework --record
          if git diff --quiet docs/reference/loc-history.json; then
            echo "LOC history is current for ${BEFORE_SHA}"
            exit 0
          fi
          echo "::error::docs/reference/loc-history.json is stale. Run 'yarn quality:loc:record' locally and commit the update in your PR."
          git diff --stat docs/reference/loc-history.json
          git checkout -- docs/reference/loc-history.json
          exit 1
