name: LOC History

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    name: Record framework LOC snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Record LOC snapshot
        run: node scripts/quality/count-loc.mjs --scope framework --record

      - name: Commit LOC history when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/loc-history.json
          if git diff --staged --quiet; then
            echo "LOC history unchanged"
            exit 0
          fi
          git commit -m "chore(quality): record LOC snapshot"
          git push
