name: Acceptance Evidence Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup
      - run: node scripts/quality/pr-ci-run.mjs acceptance-standalone
