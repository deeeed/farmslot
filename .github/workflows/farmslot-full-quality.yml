name: Farmslot Full Quality

on:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Exact pre-change main SHA for migration coverage evidence
        required: false
        type: string

concurrency:
  group: full-quality-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare complete main validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Verify pinned tmux
        run: test "$(tmux -V)" = "tmux 3.4"
      - name: Prove full file and guard coverage parity
        id: plan
        env:
          FULL_CI_BASELINE_REF: ${{ inputs.baseline_ref }}
        run: node scripts/quality/full-ci-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: full-ci-plan
          include-hidden-files: true
          path: |
            .cache/full-ci/plan.json
            .cache/full-ci/coverage.json
            .cache/full-ci/coverage-parent.json

  checks:
    name: Full checks (${{ matrix.id }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FARMSLOT_TSX_TEST_WORKERS: '2'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          lint-cache: ${{ matrix.lint && 'true' || 'false' }}
      - uses: actions/download-artifact@v4
        id: plan
        with:
          name: full-ci-plan
          path: .cache/full-ci
      - name: Run every assigned full-suite task
        env:
          FULL_CI_JOB: ${{ matrix.id }}
        run: node scripts/quality/full-ci-run.mjs "$FULL_CI_JOB"
      - uses: actions/setup-node@v6
        if: ${{ always() && matrix.node24 && steps.setup.outcome == 'success' && steps.plan.outcome == 'success' }}
        with:
          node-version: '24.16.0'
      - name: CLI gateway transport on Node 24.16
        if: ${{ always() && matrix.node24 && steps.setup.outcome == 'success' && steps.plan.outcome == 'success' }}
        env:
          FULL_CI_JOB: ${{ matrix.id }}
        run: node scripts/quality/full-ci-run.mjs "$FULL_CI_JOB"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-ci-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: .cache/full-ci/receipts/${{ matrix.id }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-timings-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: .cache/full-ci/timings
          if-no-files-found: warn

  desktop:
    name: macOS installers and boundary tests
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          name: full-ci-plan
          path: .cache/full-ci
      - run: node scripts/quality/full-ci-run.mjs desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-ci-desktop-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: .cache/full-ci/receipts/desktop.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: farmslot-macos-arm64
          retention-days: 7
          path: |
            apps/command-center-desktop/release/*.dmg
            apps/command-center-desktop/release/*.zip
            apps/command-center-desktop/release-dev/*.dmg
            apps/command-center-desktop/release-dev/*.zip
          if-no-files-found: error

  full:
    name: Full repository validation
    if: always()
    needs: [prepare, checks, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /scripts/quality/full-ci-run.mjs
            /scripts/quality/full-ci-receipts.mjs
            /scripts/quality/lib/step-timing.mjs
            /scripts/quality/lib/latest-attempts.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: full-ci-plan
          path: .cache/full-ci
      - uses: actions/download-artifact@v4
        with:
          pattern: full-ci-*-attempt-*
          path: .cache/full-ci/results
      - name: Require every full suite and guard receipt
        env:
          FULL_CI_JOB_RESULTS: >-
            {"prepare":"${{ needs.prepare.result }}","checks":"${{ needs.checks.result }}","desktop":"${{ needs.desktop.result }}"}
        run: node scripts/quality/full-ci-run.mjs verify
