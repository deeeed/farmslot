name: Command Center Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/command-center/**'
      - 'apps/companion/**'
      - 'packages/**'
      - 'services/**'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/**'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.github/workflows/command-center-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/command-center/**'
      - 'apps/companion/**'
      - 'packages/**'
      - 'services/**'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/**'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.github/workflows/command-center-quality.yml'

jobs:
  quality:
    name: Command Center quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Format check
        run: yarn format:check

      - name: ESLint ratchet and stale baseline check
        run: yarn lint

      - name: Workspace structure guard
        run: yarn quality:structure

      - name: Workspace changelog guard
        run: yarn quality:changelogs

      - name: Import boundary guard
        run: yarn quality:imports

      - name: Large-file warning
        run: yarn quality:large-files

      - name: Type escape ratchet and stale baseline check
        working-directory: apps/command-center
        run: yarn lint:type-escapes

      - name: Package/service workspace quality matrix
        run: yarn quality:workspaces

      - name: Command Center typecheck
        run: yarn typecheck

      - name: Protocol compatibility tests
        run: yarn test:protocol

      - name: Recipe harness tests
        run: yarn test:recipe-harness

      - name: Package publish readiness
        run: node scripts/quality/check-farmslot-package-readiness.mjs --pack

      - name: Docs build
        run: yarn docs:build

      - name: UI model tests
        working-directory: apps/command-center
        run: yarn test:ui

      - name: Recipe operational gate tests
        working-directory: apps/command-center
        run: yarn test:recipe-operational-gates

      - name: Companion model tests
        working-directory: apps/companion
        run: yarn test:lib

      - name: Fetch Sonar issues evidence
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "${SONAR_HOST_URL:-}" || -z "${SONAR_TOKEN:-}" || -z "${SONAR_PROJECT_KEY:-}" ]]; then
            echo "Skipping Sonar issue fetch: secrets not configured."
            exit 0
          fi
          node scripts/quality/fetch-sonar-issues.mjs

      - name: Upload Sonar issues evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: sonar-issues
          path: temp/quality/sonar-issues.json
          if-no-files-found: ignore
