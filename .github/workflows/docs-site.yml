name: Docs Site

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'apps/command-center/**'
      - 'packages/protocol/**'
      - 'services/gateway/**'
      - 'packages/cli/**'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/build-hosted-command-center.mjs'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Build protocol package
        run: yarn workspace @farmslot/protocol build

      - name: Build docs site
        run: yarn docs:build

      - name: Build hosted Command Center
        run: yarn cc:build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
