name: Farmslot Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      replay_pr:
        description: Replay a PR changed-file set against this checkout for timing proof
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Prepare replay checks' || 'Prepare affected PR checks' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Plan dependency-affected tests and checks
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/quality/pr-ci-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pr-ci-plan
          include-hidden-files: true
          path: .cache/pr-ci/plan.json

  checks:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Replay checks' || 'PR checks' }} (${{ matrix.id }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup
        with:
          lint-cache: ${{ matrix.lint && 'true' || 'false' }}
      - uses: actions/download-artifact@v4
        with:
          name: pr-ci-plan
          path: .cache/pr-ci
      - name: Run assigned checks once
        env:
          CI_JOB_ID: ${{ matrix.id }}
        run: node scripts/quality/pr-ci-run.mjs "$CI_JOB_ID"
      - name: Retain check receipts and test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ci-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .cache/pr-ci/receipts
            .cache/pr-ci/timings
          if-no-files-found: error

  quality:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Replay results' || 'PR quality gates' }}
    if: always()
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: pr-ci-plan
          path: .cache/pr-ci
      - uses: actions/download-artifact@v4
        with:
          pattern: pr-ci-*-attempt-*
          path: .cache/pr-ci/results
      - name: Require every selected check and test receipt
        env:
          CI_MATRIX_RESULT: ${{ needs.checks.result }}
        run: node scripts/quality/pr-ci-run.mjs verify
