name: Farmslot Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      replay_pr:
        description: Replay a PR changed-file set against this checkout for timing proof
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Prepare replay checks' || 'Prepare affected PR checks' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      inline_plan: ${{ steps.plan.outputs.inline_plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Planning reads only TypeScript from node_modules. The full install is
      # restored and validated by the install job, in parallel with the checks.
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - id: planner-typescript
        uses: actions/cache/restore@v4
        with:
          path: node_modules/typescript
          key: planner-typescript-v1-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - if: steps.planner-typescript.outputs.cache-hit != 'true'
        uses: ./.github/actions/ci-setup
      - name: Plan dependency-affected tests and checks
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/quality/pr-ci-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pr-ci-plan
          include-hidden-files: true
          path: .cache/pr-ci/plan.json

  install:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Validate replay install' || 'Validate install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup

  checks:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Replay checks' || 'PR checks' }} (${{ matrix.id }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-setup
        with:
          reuse-validated-install: 'true'
          lint-cache: ${{ matrix.lint && 'true' || 'false' }}
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.inline_plan == ''
        with:
          name: pr-ci-plan
          path: .cache/pr-ci
      - name: Run assigned checks once
        env:
          CI_JOB_ID: ${{ matrix.id }}
          CI_INLINE_PR_PLAN: ${{ needs.prepare.outputs.inline_plan }}
        run: node scripts/quality/pr-ci-run.mjs "$CI_JOB_ID"
      - name: Retain check receipts and test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ci-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .cache/pr-ci/receipts
            .cache/pr-ci/timings
          if-no-files-found: error

  quality:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Replay results' || 'PR quality gates' }}
    if: always()
    needs: [prepare, install, checks]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Receipt verification uses only built-in Node modules and the sparse checkout.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /scripts/quality/pr-ci-run.mjs
            /scripts/quality/lib/step-timing.mjs
            /scripts/quality/lib/latest-attempts.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.inline_plan == ''
        with:
          name: pr-ci-plan
          path: .cache/pr-ci
      - uses: actions/download-artifact@v4
        with:
          pattern: pr-ci-*-attempt-*
          path: .cache/pr-ci/results
      - name: Require every selected check and test receipt
        env:
          CI_MATRIX_RESULT: ${{ needs.checks.result }}
          CI_INSTALL_RESULT: ${{ needs.install.result }}
          CI_INLINE_PR_PLAN: ${{ needs.prepare.outputs.inline_plan }}
        run: |
          node --version
          node scripts/quality/pr-ci-run.mjs verify
