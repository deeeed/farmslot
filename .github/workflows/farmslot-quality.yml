name: Farmslot Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs for the same pull request (or ref, for pushes and
# manual dispatch). Queue time is currently 0, so this buys runner-seconds
# rather than latency: a force-push previously left the obsolete head running to
# completion. The newest head still gets a full run, so coverage is unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed quality targets
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.filter.outputs.repo }}
      package_readiness: ${{ steps.filter.outputs.package_readiness }}
      command_center: ${{ steps.filter.outputs.command_center }}
      companion: ${{ steps.filter.outputs.companion }}
      docs: ${{ steps.filter.outputs.docs }}
      cli: ${{ steps.filter.outputs.cli }}
      expo_recipe: ${{ steps.filter.outputs.expo_recipe }}
      agent_runtime: ${{ steps.filter.outputs.agent_runtime }}
      protocol: ${{ steps.filter.outputs.protocol }}
      recipe_harness: ${{ steps.filter.outputs.recipe_harness }}
      skills: ${{ steps.filter.outputs.skills }}
      theme: ${{ steps.filter.outputs.theme }}
      gateway: ${{ steps.filter.outputs.gateway }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed quality targets
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            repo:
              - '**'
            package_readiness:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/**'
              - 'scripts/quality/check-farmslot-package-readiness.mjs'
            command_center:
              - '.github/workflows/farmslot-quality.yml'
              - '.prettierrc.json'
              - 'eslint.config.mjs'
              - 'package.json'
              - 'yarn.lock'
              - 'apps/command-center/**'
              - 'packages/cli/**'
              - 'packages/protocol/**'
              - 'packages/recipe-harness/**'
              - 'packages/theme/**'
              - 'services/gateway/**'
              - 'services/node/**'
            companion:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'scripts/quality/check-companion-structure.mjs'
              - 'apps/companion/**'
              - 'packages/expo-recipe/**'
              - 'packages/protocol/**'
              - 'packages/recipe-harness/**'
              - 'packages/theme/**'
            docs:
              - '.github/workflows/farmslot-quality.yml'
              - '.github/workflows/docs-site.yml'
              - '.github/workflows/docs-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'apps/command-center/**'
              - 'apps/docs/**'
              - 'packages/cli/**'
              - 'packages/protocol/**'
              - 'scripts/build-hosted-command-center.mjs'
              - 'services/gateway/**'
            cli:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/cli/**'
              - 'packages/protocol/**'
              - 'packages/recipe-harness/**'
            expo_recipe:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/expo-recipe/**'
              - 'packages/protocol/**'
              - 'packages/recipe-harness/**'
            agent_runtime:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/agent-runtime/**'
              - 'packages/protocol/**'
            protocol:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/protocol/**'
            recipe_harness:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/protocol/**'
              - 'packages/recipe-harness/**'
            skills:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/agent-runtime/**'
              - 'packages/skills/**'
            theme:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/theme/**'
            gateway:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/protocol/**'
              - 'services/gateway/**'
            node:
              - '.github/workflows/farmslot-quality.yml'
              - 'package.json'
              - 'yarn.lock'
              - 'packages/protocol/**'
              - 'services/node/**'

  repo:
    name: Repository quality guards
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Format check
        run: yarn format:check

      - name: ESLint ratchet and stale baseline check
        run: yarn lint

      - name: Workspace structure guard
        run: yarn quality:structure

      - name: Workspace changelog guard
        run: yarn quality:changelogs

      - name: Protocol method matrix guard
        run: yarn quality:method-matrix

      - name: Authorization conformance guard
        run: yarn quality:authorization

      - name: Retired-scripts guard
        run: yarn quality:retired-scripts

      - name: Import boundary guard
        run: yarn quality:imports

      - name: Large-file warning
        run: yarn quality:large-files

      - name: Project hook conformance tests
        run: yarn test:project-hooks

      - name: LOC history drift advisory
        run: yarn quality:loc:advisory

  package-readiness:
    name: Package publish readiness
    needs: changes
    if: needs.changes.outputs.package_readiness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Package publish readiness
        run: node scripts/quality/check-farmslot-package-readiness.mjs --pack

  command-center:
    name: Command Center quality gates
    needs: changes
    if: needs.changes.outputs.command_center == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Build recipe harness package
        run: yarn workspace @farmslot/recipe-harness build

      - name: Command Center quality
        working-directory: apps/command-center
        run: yarn quality

      - name: Recipe operational gate tests
        working-directory: apps/command-center
        run: yarn test:recipe-operational-gates

      - name: Fetch Sonar issues evidence
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "${SONAR_HOST_URL:-}" || -z "${SONAR_TOKEN:-}" || -z "${SONAR_PROJECT_KEY:-}" ]]; then
            echo "Skipping Sonar issue fetch: secrets not configured."
            exit 0
          fi
          node scripts/quality/fetch-sonar-issues.mjs

      - name: Upload Sonar issues evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: sonar-issues
          path: temp/quality/sonar-issues.json
          if-no-files-found: ignore

  companion:
    name: Companion quality gates
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Companion quality
        working-directory: apps/companion
        run: yarn quality

  docs:
    name: Docs quality gates
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Docs quality
        working-directory: apps/docs
        run: yarn quality

      - name: Hosted Pages bundle
        run: yarn cc:build:pages

  cli:
    name: CLI package quality
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: CLI quality
        run: yarn workspace @farmslot/cli quality

  expo-recipe:
    name: Expo recipe package quality
    needs: changes
    if: needs.changes.outputs.expo_recipe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Expo recipe quality
        run: yarn workspace @farmslot/expo-recipe quality

  protocol:
    name: Protocol package quality
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Protocol quality
        run: yarn workspace @farmslot/protocol quality

  agent-runtime:
    name: Agent runtime package quality
    needs: changes
    if: needs.changes.outputs.agent_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Agent runtime quality
        run: yarn workspace @farmslot/agent-runtime quality

  recipe-harness:
    name: Recipe harness package quality
    needs: changes
    if: needs.changes.outputs.recipe_harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Recipe harness quality
        run: yarn workspace @farmslot/recipe-harness quality

  skills:
    name: Skills package quality
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Skills quality
        run: yarn workspace @farmslot/skills quality

  theme:
    name: Theme package quality
    needs: changes
    if: needs.changes.outputs.theme == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Theme quality
        run: yarn workspace @farmslot/theme quality

  gateway:
    name: Gateway service quality
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Gateway quality
        run: yarn workspace @farmslot/gateway quality

  node:
    name: Node service quality
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Node service quality
        run: yarn workspace @farmslot/node quality
