name: Docs Quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Docs quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Docs quality
        working-directory: apps/docs
        run: yarn quality
