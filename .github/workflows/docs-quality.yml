name: Docs Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'packages/protocol/**'
      - 'services/gateway/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/docs-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'packages/protocol/**'
      - 'services/gateway/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/docs-quality.yml'

jobs:
  quality:
    name: Docs quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Build protocol package
        run: yarn workspace @farmslot/protocol build

      - name: Docs build
        run: yarn docs:build
