name: Repository Hygiene

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel superseded runs for the same pull request (or ref, for pushes). See
# farmslot-quality.yml — same rationale, kept identical so the two workflows do
# not drift apart.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Conventional PR title and commit subjects
        run: node scripts/quality/check-conventional-commits.mjs --github-event

      - name: Workspace changelog guard
        run: node scripts/quality/check-workspace-changelogs.mjs

      - name: Workspace changelog PR delta guard
        if: github.event_name == 'pull_request'
        run: node scripts/quality/check-workspace-changelogs.mjs --pr-diff
