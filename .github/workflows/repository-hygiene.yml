name: Repository Hygiene

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel superseded PR checks; queue every main push without replacing pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  hygiene:
    name: Repository hygiene gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Conventional PR title and commit subjects
        run: node scripts/quality/check-conventional-commits.mjs --github-event

      - name: Workspace changelog guard
        run: node scripts/quality/check-workspace-changelogs.mjs

      - name: Workspace changelog PR delta guard
        if: github.event_name == 'pull_request'
        run: node scripts/quality/check-workspace-changelogs.mjs --pr-diff
