<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" rx="32" fill="#081411"/>
  <rect x="34" y="34" width="1132" height="652" rx="26" fill="#10241f" stroke="#2c6b5b"/>
  <text x="70" y="92" fill="#6ee7c8" font-family="Inter, sans-serif" font-size="30" font-weight="800">Backlog + Dispatch</text>
  <text x="70" y="124" fill="#a7d9cc" font-family="Inter, sans-serif" font-size="16">Raw intent becomes refined, policy-checked work when safe slots are available</text>

  <g font-family="Inter, sans-serif">
    <rect x="70" y="170" width="220" height="360" rx="20" fill="#0d1d19" stroke="#245c4e"/>
    <text x="98" y="214" fill="#6ee7c8" font-size="18" font-weight="700">Intake</text>
    <rect x="98" y="244" width="164" height="58" rx="13" fill="#14352e"/>
    <text x="118" y="279" fill="#f7fffc" font-size="15">voice idea</text>
    <rect x="98" y="324" width="164" height="58" rx="13" fill="#14352e"/>
    <text x="118" y="359" fill="#f7fffc" font-size="15">raw note</text>
    <rect x="98" y="404" width="164" height="58" rx="13" fill="#14352e"/>
    <text x="118" y="439" fill="#f7fffc" font-size="15">backlog item</text>

    <rect x="350" y="170" width="250" height="360" rx="20" fill="#0d1d19" stroke="#245c4e"/>
    <text x="378" y="214" fill="#6ee7c8" font-size="18" font-weight="700">Refinement</text>
    <text x="378" y="260" fill="#f7fffc" font-size="16">scope</text>
    <text x="378" y="304" fill="#f7fffc" font-size="16">acceptance criteria</text>
    <text x="378" y="348" fill="#f7fffc" font-size="16">risk + safety tier</text>
    <text x="378" y="392" fill="#f7fffc" font-size="16">validation recipe</text>
    <text x="378" y="436" fill="#f7fffc" font-size="16">runner profile</text>

    <rect x="660" y="170" width="220" height="360" rx="20" fill="#0d1d19" stroke="#245c4e"/>
    <text x="688" y="214" fill="#6ee7c8" font-size="18" font-weight="700">Queue policy</text>
    <rect x="688" y="246" width="164" height="54" rx="13" fill="#14352e"/>
    <text x="710" y="279" fill="#f7fffc" font-size="15">ready</text>
    <rect x="688" y="326" width="164" height="54" rx="13" fill="#14352e"/>
    <text x="710" y="359" fill="#f7fffc" font-size="15">blocked</text>
    <rect x="688" y="406" width="164" height="54" rx="13" fill="#14352e"/>
    <text x="710" y="439" fill="#f7fffc" font-size="15">needs human</text>

    <rect x="940" y="170" width="190" height="360" rx="20" fill="#0d1d19" stroke="#245c4e"/>
    <text x="968" y="214" fill="#6ee7c8" font-size="18" font-weight="700">Dispatch</text>
    <text x="968" y="264" fill="#f7fffc" font-size="16">slot available</text>
    <text x="968" y="308" fill="#f7fffc" font-size="16">node healthy</text>
    <text x="968" y="352" fill="#f7fffc" font-size="16">runner matched</text>
    <text x="968" y="396" fill="#f7fffc" font-size="16">evidence plan</text>
    <rect x="968" y="438" width="130" height="48" rx="12" fill="#1e6b59"/>
    <text x="992" y="469" fill="#f7fffc" font-size="15" font-weight="700">start run</text>
  </g>

  <path d="M290 350 H350" stroke="#6ee7c8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 350 H660" stroke="#6ee7c8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M880 350 H940" stroke="#6ee7c8" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#6ee7c8"/>
    </marker>
  </defs>
</svg>
