# Bash-only defaults file; sourced by scripts with #!/usr/bin/env bash.
: "${APP_VARIANT:=development}"
: "${GATEWAY_PORT:=7777}"
: "${METRO_CONNECTION:=auto}"
# Leave targets empty by default so each worktree/slot can provide its own
# device name/serial via the ignored agentic.local.conf or environment.
: "${SIMULATOR:=}"
: "${IOS_SIMULATOR:=}"
: "${IOS_DEVICE_UDID:=}"
: "${ANDROID_DEVICE:=}"
: "${ADB_SERIAL:=}"
: "${ANDROID_SERIAL:=}"

_COMPANION_ENV_DEFAULT_VARS=(
  APP_VARIANT
  METRO_PORT
  WATCHER_PORT
  GATEWAY_PORT
  METRO_CONNECTION
  SIMULATOR
  IOS_SIMULATOR
  IOS_DEVICE_UDID
  ANDROID_DEVICE
  ADB_SERIAL
  ANDROID_SERIAL
  SITEED_BUNDLE_BASE
  SITEED_SCHEME_BASE
  SCHEME
  BUNDLE_ID
)
for _COMPANION_ENV_VAR in "${_COMPANION_ENV_DEFAULT_VARS[@]}"; do
  eval "if [[ \${${_COMPANION_ENV_VAR}+set} ]]; then _COMPANION_HAS_${_COMPANION_ENV_VAR}=1; _COMPANION_EXPLICIT_${_COMPANION_ENV_VAR}=\"\${${_COMPANION_ENV_VAR}}\"; fi"
done

_AGENTIC_CONF_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
_AGENTIC_LOCAL_CONF="${COMPANION_AGENTIC_LOCAL_CONF:-${_AGENTIC_CONF_DIR}/agentic.local.conf}"
if [[ -f "${_AGENTIC_LOCAL_CONF}" ]]; then
  # shellcheck source=./agentic.local.conf
  source "${_AGENTIC_LOCAL_CONF}"
fi
unset _AGENTIC_CONF_DIR _AGENTIC_LOCAL_CONF

for _COMPANION_ENV_VAR in "${_COMPANION_ENV_DEFAULT_VARS[@]}"; do
  eval "if [[ \${_COMPANION_HAS_${_COMPANION_ENV_VAR}:-0} == 1 ]]; then ${_COMPANION_ENV_VAR}=\"\${_COMPANION_EXPLICIT_${_COMPANION_ENV_VAR}}\"; fi"
  eval "unset _COMPANION_HAS_${_COMPANION_ENV_VAR} _COMPANION_EXPLICIT_${_COMPANION_ENV_VAR}"
done
unset _COMPANION_ENV_VAR _COMPANION_ENV_DEFAULT_VARS

# METRO_PORT is the canonical Expo/RN name. WATCHER_PORT is accepted for older
# Farmslot/project scripts and mapped into METRO_PORT when supplied.
: "${METRO_PORT:=${WATCHER_PORT:-7677}}"
: "${WATCHER_PORT:=${METRO_PORT}}"

: "${SITEED_BUNDLE_BASE:=net.siteed.farmslot}"
: "${SITEED_SCHEME_BASE:=farmslot}"
case "${APP_VARIANT}" in
  development)
    _COMPANION_DEFAULT_SCHEME="${SITEED_SCHEME_BASE}-development"
    _COMPANION_DEFAULT_BUNDLE_ID="${SITEED_BUNDLE_BASE}.development"
    ;;
  preview)
    _COMPANION_DEFAULT_SCHEME="${SITEED_SCHEME_BASE}-preview"
    _COMPANION_DEFAULT_BUNDLE_ID="${SITEED_BUNDLE_BASE}.preview"
    ;;
  production)
    _COMPANION_DEFAULT_SCHEME="${SITEED_SCHEME_BASE}"
    _COMPANION_DEFAULT_BUNDLE_ID="${SITEED_BUNDLE_BASE}"
    ;;
  *)
    echo "ERROR: unsupported APP_VARIANT '${APP_VARIANT}' (expected development, preview, or production)." >&2
    return 1 2>/dev/null || exit 1
    ;;
esac
: "${SCHEME:=${_COMPANION_DEFAULT_SCHEME}}"
: "${BUNDLE_ID:=${_COMPANION_DEFAULT_BUNDLE_ID}}"
unset _COMPANION_DEFAULT_SCHEME _COMPANION_DEFAULT_BUNDLE_ID

export APP_VARIANT METRO_PORT WATCHER_PORT SCHEME BUNDLE_ID GATEWAY_PORT METRO_CONNECTION
