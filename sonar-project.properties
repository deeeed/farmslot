# SonarQube/SonarCloud scanner configuration for the Farmslot monorepo.
# Keep secrets and deployment-specific identifiers out of this file.
# Use SONAR_HOST_URL, SONAR_TOKEN, and SONAR_PROJECT_KEY from the environment.

sonar.projectName=Farmslot
sonar.sourceEncoding=UTF-8

# Analyze the checked-in monorepo. Do not include projects/* broadly by default:
# those directories can contain nested/private repositories on developer machines.
sonar.sources=apps,packages,services,scripts,docs,projects/farmslot-farm
sonar.tests=apps,packages,services,scripts

# Tests are co-located with source in this repo, so remove them from main-code scope
# and add them back through test scope.
sonar.exclusions=**/node_modules/**,**/.yarn/**,**/dist/**,**/build/**,**/coverage/**,**/.docusaurus/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.mjs,**/*.d.ts,temp/**,.sandbox/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.mjs,**/tests/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Import JS/TS coverage when local or CI test commands produce LCOV files.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,apps/command-center/coverage/lcov.info,apps/command-center/ui/coverage/lcov.info,apps/companion/coverage/lcov.info,packages/cli/coverage/lcov.info,packages/expo-recipe/coverage/lcov.info,services/gateway/coverage/lcov.info,services/node/coverage/lcov.info,packages/protocol/coverage/lcov.info,packages/recipe-harness/coverage/lcov.info,packages/theme/coverage/lcov.info

# Keep coverage focused on product/library code, not config, generated output,
# scripts, docs, templates, fixtures, or test helpers.
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.d.ts,**/*.config.*,**/eslint.config.*,scripts/**,docs/**,apps/docs/**,projects/farmslot-farm/**,**/fixtures/**,**/templates/**,**/probes/**,**/tests/**
sonar.cpd.exclusions=**/*.test.*,**/*.spec.*,**/fixtures/**,**/templates/**,docs/**,projects/farmslot-farm/**
